<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e-Bidding ซัพพลายเออร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#f1f4f9; --surface:#ffffff; --surface-2:#e9edf5; --surface-3:#dde3ef;
  --ink:#0f1729; --ink-2:#455168; --ink-3:#6b7791;
  --line:#d6dce9; --line-strong:#b7c1d6;
  --accent:#1E40AF; --accent-2:#16308a; --accent-wash:#e7ecfb; --accent-line:#b6c5ee;
  --good:#15803d; --good-wash:#e3f2e8;
  --warn:#8a5808; --warn-wash:#faeed7;
  --crit:#a63636; --crit-wash:#f8e5e3;
  --seal:#6d28d9; --seal-wash:#f0eafd;
  --shadow-1:0 1px 2px rgba(15,23,41,.05);
  --shadow-2:0 1px 2px rgba(15,23,41,.06), 0 10px 28px -14px rgba(15,23,41,.26);
  --logo-filter:none;
  --r:10px; --r-s:6px;
  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-b:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","IBM Plex Sans Thai",system-ui,sans-serif;
  --font-m:ui-monospace,"SF Mono",SFMono-Regular,Menlo,"IBM Plex Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0a0f19; --surface:#111726; --surface-2:#182031; --surface-3:#212a3d;
    --ink:#e8ecf5; --ink-2:#a4aec3; --ink-3:#7d8798;
    --line:#232c3e; --line-strong:#354055;
    --accent:#8ca9f8; --accent-2:#b6c8ff; --accent-wash:#15203c; --accent-line:#2b3d6c;
    --good:#5ec78b; --good-wash:#122e1f;
    --warn:#e0aa52; --warn-wash:#33260f;
    --crit:#ef8d84; --crit-wash:#331c1a;
    --seal:#b79cf5; --seal-wash:#241a3d;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.6);
    --logo-filter:brightness(1.24) saturate(1.06);
  }
}
:root[data-theme="dark"]{
  --ground:#0a0f19; --surface:#111726; --surface-2:#182031; --surface-3:#212a3d;
  --ink:#e8ecf5; --ink-2:#a4aec3; --ink-3:#7d8798;
  --line:#232c3e; --line-strong:#354055;
  --accent:#8ca9f8; --accent-2:#b6c8ff; --accent-wash:#15203c; --accent-line:#2b3d6c;
  --good:#5ec78b; --good-wash:#122e1f;
  --warn:#e0aa52; --warn-wash:#33260f;
  --crit:#ef8d84; --crit-wash:#331c1a;
  --seal:#b79cf5; --seal-wash:#241a3d;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 1px 2px rgba(0,0,0,.35), 0 12px 30px -14px rgba(0,0,0,.6);
  --logo-filter:brightness(1.24) saturate(1.06);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-d);margin:0;text-wrap:balance;letter-spacing:-.019em}
h1{font-size:1.5rem;font-weight:700;line-height:1.25}
h2{font-size:1.15rem;font-weight:600}
h3{font-size:1rem;font-weight:600}
p{margin:0}
a{color:var(--accent);text-decoration-thickness:1px;text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;vertical-align:-3px}
.seg b svg{width:17px;height:17px}
.rank svg{width:13px;height:13px}
.num{font-family:var(--font-m);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3);font-size:.82rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  padding:.55rem .9rem;border-radius:var(--r-s);font-weight:500;cursor:pointer;box-shadow:var(--shadow-1);transition:background .12s,border-color .12s,transform .08s}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary,
:root:not([data-theme="light"]) .btn.primary{color:#0a1633}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.primary{color:#fff}}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:.34rem .6rem;font-size:.84rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.danger{color:var(--crit);border-color:var(--line)}
label.f{display:flex;flex-direction:column;gap:.3rem}
label.f > span{font-size:.8rem;font-weight:500;color:var(--ink-2)}
input[type=text],input[type=number],input[type=password],input[type=datetime-local],textarea,select{
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-s);padding:.5rem .6rem;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
input.num,td input{text-align:right}
textarea{min-height:76px;resize:vertical}

/* ---------- chips ---------- */
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.16rem .5rem;border-radius:999px;font-size:.74rem;font-weight:600;
  border:1px solid transparent;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.sealed{background:var(--seal-wash);color:var(--seal);border-color:color-mix(in srgb,var(--seal) 30%,transparent)}
.chip.open{background:var(--accent-wash);color:var(--accent-2);border-color:var(--accent-line)}
.chip.live{background:var(--good-wash);color:var(--good)}
.chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.crit{background:var(--crit-wash);color:var(--crit)}
.chip.flat{background:var(--surface-2);color:var(--ink-2);border-color:var(--line)}
.chip.hammer{background:var(--warn-wash);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent)}
.chip.onair{background:var(--crit-wash);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 34%,transparent);letter-spacing:.04em}
.bid.hammer{box-shadow:inset 3px 0 0 var(--warn)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pulse{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:1.1rem;padding:1.1rem .9rem;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:.6rem;align-items:center}
.logo{height:44px;width:auto;flex:none;display:block;filter:var(--logo-filter)}
.logo.sm{height:32px}
.phone .logo.sm{height:29px}
.brand b{font-family:var(--font-d);font-size:.95rem;display:block;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:.6rem;background:none;border:0;text-align:left;padding:.5rem .6rem;border-radius:var(--r-s);cursor:pointer;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-wash);color:var(--accent-2);font-weight:600}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
.nav .badge{margin-left:auto;font-family:var(--font-m);font-size:.72rem;background:var(--surface-3);color:var(--ink-2);padding:0 .35rem;border-radius:4px}
.whoami{margin-top:auto;border-top:1px solid var(--line);padding-top:.8rem;display:flex;flex-direction:column;gap:.5rem}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-family:var(--font-d);font-weight:600;font-size:.8rem;flex:none;color:var(--ink-2)}
.main{min-width:0;display:flex;flex-direction:column}
.demobar{display:flex;align-items:center;gap:.5rem .6rem;flex-wrap:wrap;padding:.45rem .9rem;background:var(--warn-wash);color:var(--warn);border-bottom:1px solid color-mix(in srgb,var(--warn) 25%,transparent);font-size:.8rem}
.demobar .btn{background:transparent;border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);box-shadow:none}
.demobar label{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}
.page{padding:1.4rem 1.2rem 4.5rem;max-width:1180px;width:100%;display:flex;flex-direction:column;gap:1.2rem}
.pagehead{display:flex;gap:1rem;align-items:flex-start;flex-wrap:wrap}
.pagehead .grow{flex:1;min-width:240px}
.tabbar{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  .main{padding-bottom:0}
  .page{padding:1rem .85rem 5.5rem}
  .mtop{display:flex;align-items:center;gap:.6rem;padding:.6rem .85rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:var(--surface);border-top:1px solid var(--line);padding:.3rem .3rem calc(.3rem + env(safe-area-inset-bottom))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:.35rem 0;color:var(--ink-3);font-size:.68rem;font-weight:500;cursor:pointer;border-radius:var(--r-s)}
  .tabbar button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6}
  .tabbar button[aria-current="page"]{color:var(--accent)}
}
@media (min-width:901px){.mtop{display:none}}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1);min-width:0}
.card.pad{padding:1rem}
.card > header{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.75rem 1rem;border-bottom:1px solid var(--line)}
.card > header h3{flex:1;min-width:120px}
.card > .body{padding:1rem}
.grid{display:grid;gap:.9rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.split{display:grid;gap:1.1rem;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
@media (max-width:1000px){.split{grid-template-columns:minmax(0,1fr)}}
.stack{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.row{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
.spread{display:flex;align-items:baseline;justify-content:space-between;gap:.6rem}

/* stat tile */
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:.8rem .9rem;display:flex;flex-direction:column;gap:.35rem}
.stat .v{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:600;line-height:1.1;letter-spacing:-.03em}
.meter{height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.meter i.good{background:var(--good)}
.meter i.crit{background:var(--crit)}

/* tender list */
.tlist{display:flex;flex-direction:column}
.titem{display:flex;gap:.8rem;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem 1rem;cursor:pointer;color:inherit}
.titem:last-child{border-bottom:0}
.titem:hover{background:var(--surface-2)}
.titem .stripe{width:3px;border-radius:2px;align-self:stretch;background:var(--line-strong);flex:none}
.titem .stripe.live{background:var(--good)}
.titem .stripe.soon{background:var(--warn)}
.titem .stripe.closed{background:var(--line-strong)}
.titem .stripe.awarded{background:var(--accent)}
.titem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:.3rem}
.titem .t b{font-family:var(--font-d);font-weight:600;font-size:.97rem}
.titem .r{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem;flex:none}
.cd{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-size:.86rem;font-weight:500}
.cd.soon{color:var(--warn)}
.cd.over{color:var(--ink-3)}

/* bid rows */
.bids{display:flex;flex-direction:column}
.bid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.7rem;align-items:center;padding:.7rem 1rem;border-bottom:1px solid var(--line)}
.bid:last-child{border-bottom:0}
.bid.me{background:var(--accent-wash)}
.bid.win{background:var(--good-wash)}
.rank{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;font-family:var(--font-m);font-size:.8rem;font-weight:600;
  background:var(--surface-3);color:var(--ink-2);flex:none}
.bid.win .rank{background:var(--good);color:#fff}
:root[data-theme="dark"] .bid.win .rank,:root:not([data-theme="light"]) .bid.win .rank{color:#0a1633}
.bid .who{min-width:0}
.bid .who b{display:block;font-weight:600;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bid .amt{text-align:right;flex:none}
.bid .amt .v{font-family:var(--font-m);font-variant-numeric:tabular-nums;font-weight:600;font-size:1rem;letter-spacing:-.02em}
.bid .amt .d{font-size:.72rem;color:var(--ink-3)}
.bid .amt .d.up{color:var(--crit)}
.bid .amt .d.down{color:var(--good)}
.locked{filter:blur(5px);user-select:none;opacity:.7}

/* table */
.tablewrap{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.9rem;min-width:460px}
th,td{padding:.5rem .6rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.74rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:600;border-top:1px solid var(--line-strong);border-bottom:0}
td.mono,tfoot td.mono{font-family:var(--font-m);font-variant-numeric:tabular-nums}

/* docs */
.docs{display:flex;flex-direction:column;gap:.4rem}
.doc{display:flex;align-items:center;gap:.6rem;padding:.45rem .55rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.ext{font-family:var(--font-m);font-size:.66rem;font-weight:600;padding:.15rem .3rem;border-radius:4px;background:var(--surface-3);color:var(--ink-2);flex:none;text-transform:uppercase}
.doc .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.86rem}
.drop{border:1px dashed var(--line-strong);border-radius:var(--r-s);padding:.9rem;text-align:center;background:var(--surface-2);cursor:pointer;display:block}
.drop:hover{border-color:var(--accent);background:var(--accent-wash)}
.req{display:flex;align-items:flex-start;gap:.45rem;font-size:.86rem;padding:.15rem 0}
.req svg{width:14px;height:14px;flex:none;margin-top:.25rem;stroke-width:2;fill:none}
.req.ok{color:var(--good)}
.req.no{color:var(--ink-3)}

/* rule box */
.rule{border-left:3px solid var(--accent);background:var(--accent-wash);padding:.65rem .8rem;border-radius:0 var(--r-s) var(--r-s) 0;font-size:.85rem;color:var(--ink-2)}
.rule b{color:var(--ink)}
.feed{display:flex;flex-direction:column;gap:.7rem;max-height:340px;overflow-y:auto}
.ev{display:grid;grid-template-columns:auto 1fr;gap:.6rem;font-size:.85rem}
.ev time{font-family:var(--font-m);font-size:.74rem;color:var(--ink-3);white-space:nowrap}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:1.5rem .9rem;background:
  radial-gradient(120% 90% at 100% 0%, var(--accent-wash) 0%, transparent 55%),
  radial-gradient(90% 70% at 0% 100%, var(--surface-2) 0%, transparent 60%), var(--ground)}
.loginbox{width:100%;max-width:430px;display:flex;flex-direction:column;gap:1rem}
.acct{display:flex;gap:.7rem;align-items:center;width:100%;text-align:left;padding:.6rem .7rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);cursor:pointer;color:inherit}
.acct:hover{border-color:var(--accent-line);background:var(--accent-wash)}
.acct[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-wash)}
.acct .t{flex:1;min-width:0}
.acct .t b{display:block;font-size:.9rem;font-weight:600}

/* toasts + modal */
#toasts{position:fixed;right:.8rem;bottom:.8rem;z-index:70;display:flex;flex-direction:column;gap:.5rem;max-width:min(340px,calc(100vw - 1.6rem))}
@media (max-width:900px){#toasts{bottom:calc(4.4rem + env(safe-area-inset-bottom))}}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r-s);
  padding:.6rem .7rem;box-shadow:var(--shadow-2);font-size:.85rem;animation:slide .22s ease-out}
.toast.good{border-left-color:var(--good)}
.toast.crit{border-left-color:var(--crit)}
.toast b{display:block;font-size:.8rem}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scrim{position:fixed;inset:0;background:rgba(8,14,15,.55);z-index:60;display:grid;place-items:end center;padding:0}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:14px 14px 0 0;border:1px solid var(--line);box-shadow:var(--shadow-2)}
@media (min-width:700px){.scrim{place-items:center}.sheet{border-radius:14px}}
.sheet > header{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:.6rem;padding:.85rem 1rem;border-bottom:1px solid var(--line);z-index:2}
.sheet > header h2{flex:1}
.sheet .body{padding:1rem;display:flex;flex-direction:column;gap:.9rem}
.sheet > footer{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:.75rem 1rem;display:flex;gap:.6rem;justify-content:flex-end}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.seg label{border:1px solid var(--line-strong);border-radius:var(--r-s);padding:.6rem .7rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem;background:var(--surface)}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-wash);box-shadow:0 0 0 2px var(--accent-wash)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg b{font-size:.9rem}
.checks{display:flex;flex-direction:column;gap:.35rem}
.checks label{display:flex;gap:.5rem;align-items:center;font-size:.9rem}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);flex:none}
/* ---------- โหมดพรีวิวมือถือบนจอคอม ---------- */
.stage{display:flex;flex-direction:column;align-items:center;gap:1rem;padding:1.5rem 1rem 3rem;min-height:100vh}
.stagebar{display:flex;align-items:center;justify-content:center;gap:.5rem .6rem;flex-wrap:wrap;width:100%;max-width:560px;font-size:.8rem;
  background:var(--warn-wash);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent);border-radius:10px;padding:.5rem .7rem}
.stagebar .btn{background:transparent;border-color:color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);box-shadow:none}
.stagebar label{display:inline-flex;align-items:center;gap:.35rem;cursor:pointer}
.stagenote{max-width:390px;text-align:center;color:var(--ink-3);font-size:.8rem;line-height:1.6}
.phone{position:relative;flex:none;width:390px;max-width:100%;height:788px;max-height:82vh;background:var(--ground);
  border:11px solid #161c1e;border-radius:46px;overflow:hidden;transform:translate(0);
  box-shadow:0 34px 64px -26px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.07)}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:98px;height:25px;border-radius:13px;background:#161c1e;z-index:70;pointer-events:none}
.statusbar{position:absolute;top:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;
  padding:0 1.4rem;font-size:.72rem;font-weight:600;color:var(--ink-2);background:var(--surface);z-index:55;pointer-events:none}
.screen{position:absolute;inset:42px 0 0;overflow-y:auto;overscroll-behavior:contain;background:var(--ground)}
body.phonemode #toasts{right:.7rem;left:auto;transform:none;bottom:4.3rem;max-width:270px}
.phone-toggle{display:none}
@media (min-width:1000px){.phone-toggle{display:inline-flex}}
.phone .shell{grid-template-columns:1fr;min-height:100%}
.phone .side{display:none}
.phone .demobar{display:none}
.phone .mtop{display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.phone .mtop .logo{margin-left:.1rem}
.phone .page{padding:.85rem .8rem 1.1rem}
.phone .split{grid-template-columns:minmax(0,1fr)}
.phone .g4{grid-template-columns:1fr 1fr}
.phone .pagehead{gap:.7rem}
.phone .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:sticky;bottom:0;z-index:30;
  background:var(--surface);border-top:1px solid var(--line);padding:.3rem .3rem .5rem}
.phone .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:.35rem 0;
  color:var(--ink-3);font-size:.68rem;font-weight:500;cursor:pointer;border-radius:6px}
.phone .tabbar button svg{width:20px;height:20px}
.phone .tabbar button[aria-current="page"]{color:var(--accent)}
.phone .scrim{position:absolute;inset:0}
.phone .sheet{max-width:100%;max-height:86%;border-radius:16px 16px 0 0}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ---------------- helpers ---------------- */
const me = () => U(state.userId);
const isBuyer = () => me().role === 'buyer';
const tender = id => state.tenders.find(t=>t.id===id);
const bidsOf = id => state.bids.filter(b=>b.tenderId===id);
const bidOf = (tid,sid) => state.bids.find(b=>b.tenderId===tid && b.supplierId===sid);
const total = (t,lines) => t.items.reduce((s,it)=> s + (Number(lines?.[it.id])||0)*it.qty, 0);
const bidTotal = b => total(tender(b.tenderId), b.lines);
const ranked = id => bidsOf(id).slice().sort((a,b)=>bidTotal(a)-bidTotal(b));
const statusOf = t => t.awardedTo ? 'awarded' : (Date.now() > t.closesAt ? 'closed' : 'live');
// ผู้ถือค้อนแบบ "คนเดียว" = ราคาต่ำสุดที่ถึงราคาคาดหวัง (ใช้เมื่อราคาเปิดเผยแล้ว)
function hammerBid(t){
  if (!t.target) return null;
  const best = ranked(t.id)[0];
  return best && bidTotal(best) <= t.target ? best : null;
}
// ใบนี้ถึงราคาคาดหวังหรือยัง (ไม่เปิดเผยตัวเลขเป้าออกไป)
const metTarget = (t,b) => !!(t.target && b && bidTotal(b) <= t.target);
// ค้อนมีใบเดียวทั้งงานปิดและเปิด: อยู่กับผู้เสนอต่ำสุดที่ถึงราคาคาดหวัง
// มีคนเสนอต่ำกว่า = ค้อนย้ายไปรายนั้นทันที (ผู้ขายในงานปิดราคาจึงรู้ว่าค้อนหลุดมือ แต่ไม่รู้ราคา/ชื่อคู่แข่ง)
// ฝ่ายจัดซื้อยังต้องรอเปิดซองก่อน เพราะการเห็นค้อนคือการรู้ข้อมูลราคาบางส่วน
function hammerFor(t, b){
  if (isBuyer() && !canSeeRivalPrices(t, state.userId)) return false;
  const h = hammerBid(t);
  return !!h && h.id === b.id;
}
// สถานะค้อนในมุมผู้ขาย: 'mine' | 'other' | 'none'
function myHammerState(t){
  const h = hammerBid(t);
  if (!h) return 'none';
  return h.supplierId === state.userId ? 'mine' : 'other';
}
const hammerChip = mine => `<span class="chip hammer">${ICON.gavel}${mine?'ค้อนของคุณ':'ค้อน'}</span>`;
// ตัวเลข "ราคาคาดหวัง" เห็นเฉพาะฝ่ายจัดซื้อ แต่ตัวค้อนให้ผู้ขายเห็นได้เมื่อมีสิทธิ์เห็นราคาแล้ว
// (งานเปิดราคา = เห็นสด, งานปิดซอง = เห็นหลังเปิดซอง) เพื่อกระตุ้นให้แข่งราคาต่อ
const visibleHammer = t => canSeeRivalPrices(t, state.userId) ? hammerBid(t) : null;
const closingSoon = t => statusOf(t)==='live' && t.closesAt-Date.now() < 60*MIN;

const baht = n => '฿' + Math.round(n).toLocaleString('th-TH');
const baht2 = n => '฿' + n.toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const kb = s => s>=1048576 ? (s/1048576).toFixed(1)+' MB' : Math.max(1,Math.round(s/1024))+' KB';
const ext = n => (n.split('.').pop()||'file').slice(0,4);
const clock = ts => new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const dmy = ts => new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
const sameDay = ts => new Date(ts).toDateString() === new Date().toDateString();
const when = ts => sameDay(ts) ? clock(ts) : dmy(ts) + ' ' + clock(ts);
const stamp = ts => dmy(ts) + ' ' + clock(ts);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function cdText(ms){
  if (ms<=0) return 'ปิดรับแล้ว';
  const d=Math.floor(ms/DAY), h=Math.floor(ms%DAY/HOUR), m=Math.floor(ms%HOUR/MIN), s=Math.floor(ms%MIN/1000);
  const p=n=>String(n).padStart(2,'0');
  return d>0 ? `${d} วัน ${p(h)}:${p(m)}:${p(s)}` : `${p(h)}:${p(m)}:${p(s)}`;
}
function cdHtml(t){
  const st = statusOf(t);
  if (st==='awarded') return '<span class="cd over">ประกาศผลแล้ว</span>';
  const ms = t.closesAt-Date.now();
  const cls = ms<=0 ? 'over' : (ms<60*MIN ? 'soon' : '');
  return `<span class="cd ${cls}" data-cd="${t.closesAt}">${cdText(ms)}</span>`;
}

/* ---- กฎการมองเห็นราคา (ต้นแบบของ RLS policy บน Supabase) ---- */
function canSeeRivalPrices(t, userId){
  const u = U(userId), st = statusOf(t);
  if (t.type === 'open') return true;                 // เปิด: ทุกคนเห็นเรียลไทม์
  if (t.unsealedAt) return true;                      // ปิด: เห็นหลังเปิดซองแล้ว
  if (u.role === 'buyer' && st !== 'live' ) return false; // ปิด+หมดเวลา: ต้องกดเปิดซองก่อน
  return false;
}
function visibleBids(t, userId){
  const u = U(userId);
  if (canSeeRivalPrices(t,userId)) return ranked(t.id);
  if (u.role === 'buyer') return [];
  const own = bidOf(t.id, userId);
  return own ? [own] : [];
}

function toastHost(){
  let box = document.getElementById('toasts');
  if (!box){
    box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live','polite');
  }
  const host = (state.phone ? document.querySelector('#app .screen') : document.body) || document.body;
  if (box.parentElement !== host) host.appendChild(box);
  return box;
}
function toast(title, text, kind){
  const el = document.createElement('div');
  el.className = 'toast ' + (kind||'');
  el.innerHTML = `<b>${esc(title)}</b><span class="muted">${esc(text)}</span>`;
  toastHost().appendChild(el);
  setTimeout(()=>el.remove(), 5200);
}

/* ---------------- shared bits ---------------- */
function typeChip(t){
  return t.type==='sealed'
    ? `<span class="chip sealed">${ICON.lock}ปิดราคา</span>`
    : `<span class="chip open">${ICON.eye}เปิดราคา</span>`;
}
function statusChip(t){
  const st = statusOf(t);
  if (st==='awarded') return `<span class="chip flat">ประกาศผลแล้ว</span>`;
  if (st==='closed')  return t.type==='sealed' && !t.unsealedAt
      ? `<span class="chip warn">รอเปิดซอง</span>` : `<span class="chip flat">ปิดรับราคา</span>`;
  if (closingSoon(t))  return `<span class="chip warn"><i class="dot pulse"></i>ใกล้หมดเวลา</span>`;
  return `<span class="chip live"><i class="dot pulse"></i>กำลังประมูล</span>`;
}
function maskName(t, sid){
  if (sid === state.userId) return U(sid).org + ' (คุณ)';
  if (isBuyer() || t.type==='sealed') return U(sid).org;
  const i = t.invited.indexOf(sid);
  return 'ผู้เสนอราคา ' + String.fromCharCode(65+(i<0?0:i));
}
function docList(docs){
  if (!docs || !docs.length) return `<p class="dim">ยังไม่มีเอกสารแนบ</p>`;
  return `<div class="docs">` + docs.map(d=>`
    <div class="doc"><span class="ext">${esc(ext(d.n))}</span><span class="n">${esc(d.n)}</span><span class="dim num">${kb(d.s)}</span></div>`).join('') + `</div>`;
}
function tenderRow(t){
  const st = statusOf(t);
  const stripe = st==='awarded' ? 'awarded' : st==='closed' ? 'closed' : (closingSoon(t)?'soon':'live');
  const n = bidsOf(t.id).length;
  const mine = !isBuyer() && bidOf(t.id, state.userId);
  return `<button class="titem" data-act="open:${t.id}">
    <span class="stripe ${stripe}"></span>
    <span class="t">
      <span class="row" style="gap:.4rem">${typeChip(t)}${statusChip(t)}${mine?`<span class="chip flat">${ICON.check}ยื่นราคาแล้ว</span>`:''}${(()=>{const hm=visibleHammer(t); if(!hm) return '';
        if (isBuyer()) return hammerChip(false);
        return hm.supplierId===state.userId ? hammerChip(true) : '';})()}</span>
      <b>${esc(t.title)}</b>
      <span class="dim num">${t.code} · งบ ${baht(t.budget)} · ${t.items.length} รายการ · ${n} ใบเสนอราคา</span>
    </span>
    <span class="r">${cdHtml(t)}<span class="dim">ปิดรับ ${stamp(t.closesAt)}</span></span>
  </button>`;
}

/* ---------------- supplier: bid form ---------------- */
function bidForm(t){
  const existing = bidOf(t.id, state.userId);
  const st = statusOf(t);
  const d = state.draft[t.id] || (state.draft[t.id] = {
    lines: existing ? {...existing.lines} : {},
    docs:  existing ? existing.docs.slice() : [],
    note:  existing ? existing.note : '',
  });

  if (st !== 'live'){
    return `<div class="card"><header><h3>ใบเสนอราคาของคุณ</h3>${statusChip(t)}</header><div class="body stack">
      ${existing ? `
        <div class="spread"><span class="muted">ราคารวมที่ยื่นไว้</span><b class="num" style="font-size:1.25rem">${baht2(bidTotal(existing))}</b></div>
        <p class="dim">ยื่นเมื่อ ${stamp(existing.at)} (แก้ไข ${existing.ver} ครั้ง)</p>
        ${docList(existing.docs)}`
        : `<p class="muted">ปิดรับราคาแล้ว และคุณไม่ได้ยื่นราคาในงานนี้</p>`}
    </div></div>`;
  }

  const locked = false;                           // ยื่นซ้ำได้ทั้งงานปิดและเปิด
  const sum = total(t, d.lines);
  const missingDocs = d.docs.length < t.docs.length;
  const bidding = true;                           // โหมดหยอดราคา: ไม่บังคับแนบไฟล์ตอนประมูล
  const all = ranked(t.id), best = all.length?bidTotal(all[0]):0;
  const iLead = t.type==='open' && all.length && all[0].supplierId===state.userId;
  const hasBase = t.items.every(it=>Number(d.lines[it.id])>0);
  const myMet = metTarget(t, existing);           // ราคาที่ยื่นล่าสุดถึงเป้าหรือยัง

  return `<form class="card" data-act="submitbid:${t.id}">
    <header><h3>${existing?'ปรับราคา':'ยื่นใบเสนอราคา'}</h3>${typeChip(t)}
      ${existing?`<span class="chip flat">แก้ไขครั้งที่ ${existing.ver+1}</span>`:''}</header>
    <div class="body stack">
      ${t.type==='sealed' ? `<div class="rule"><b>ประมูลแบบปิดราคา</b> — ไม่มีใครเห็นราคาของกัน แต่ปรับราคาได้ไม่จำกัดจนหมดเวลา
        ระบบจะบอกเฉพาะว่าราคาของคุณถึงเกณฑ์ที่ผู้ซื้อกำหนดแล้วหรือยัง</div>` : ''}
      ${existing && t.target ? (()=>{ const hs = myHammerState(t);
        return `<div class="rule" style="border-left-color:var(--${hs==='mine'?'warn':'line-strong'});background:var(--${hs==='mine'?'warn-wash':'surface-2'})">
        ${hs==='mine' ? `<b>${ICON.gavel} ค้อนอยู่ที่คุณ</b> — ราคาถึงเกณฑ์ผู้ซื้อและต่ำสุดขณะนี้ ถ้ามีรายอื่นเสนอต่ำกว่า ค้อนย้ายไปทันที`
          : hs==='other' ? `<b>ค้อนหลุดมือแล้ว</b> — มีรายอื่นเสนอต่ำกว่าและถึงเกณฑ์ ลดราคาแล้วหยอดใหม่เพื่อชิงกลับมา`
          : myMet ? `<b>ราคาที่คุณยื่นถึงเกณฑ์แล้ว</b> — ยังลดเพิ่มเพื่อความมั่นใจได้`
                  : `<b>ราคาที่คุณยื่นยังไม่ถึงเกณฑ์ที่ผู้ซื้อกำหนด</b> — ลดราคาแล้วหยอดใหม่ได้ไม่จำกัดจนหมดเวลา`}</div>`;})() : ''}
      <div class="tablewrap"><table>
        <thead><tr><th>รายการ</th><th class="r">จำนวน</th><th class="r" style="width:130px">ราคา/หน่วย (บาท)</th><th class="r">รวม</th></tr></thead>
        <tbody>${t.items.map(it=>{
          const p = d.lines[it.id];
          return `<tr>
            <td><b style="font-weight:600">${esc(it.name)}</b><br><span class="dim">${esc(it.spec)}</span></td>
            <td class="r mono">${it.qty.toLocaleString('th-TH')}<br><span class="dim">${esc(it.unit)}</span></td>
            <td class="r"><input type="number" step="0.01" min="0" inputmode="decimal" class="num" data-line="${it.id}" value="${p??''}" ${locked?'disabled':''} placeholder="0.00" required></td>
            <td class="r mono" data-linetotal="${it.id}">${p?baht2(p*it.qty):'—'}</td>
          </tr>`;}).join('')}
        </tbody>
        <tfoot><tr><td colspan="3" class="r">ราคารวมทั้งสิ้น (ก่อน VAT)</td><td class="r mono" data-sum style="font-size:1.05rem">${sum?baht2(sum):'—'}</td></tr>
        <tr><td colspan="3" class="r dim" style="font-weight:400">เทียบงบประมาณ ${baht(t.budget)}</td><td class="r mono dim" data-vsbudget>${sum?((sum-t.budget)/t.budget*100).toFixed(1)+'%':'—'}</td></tr></tfoot>
      </table></div>

      ${bidding ? `<div>
        <div class="spread" style="margin-bottom:.4rem"><span class="eyebrow">หยอดราคาเร็ว — ลดราคาของคุณ</span>
          ${hasBase?`<span class="dim">จากยอด ${baht(sum)}</span>`:''}</div>
        <div class="row" style="gap:.4rem">
          ${[5,10,15,20].map(pct=>`<button type="button" class="btn sm" data-act="quick:${t.id}:cut:${pct}" ${hasBase?'':'disabled'}
            title="${hasBase?'เหลือ '+baht(Math.floor(sum*(1-pct/100))):''}">−${pct}%</button>`).join('')}
        </div>
        ${t.type==='open' && best && !iLead ? `<div class="row" style="gap:.4rem;margin-top:.45rem">
          <button type="button" class="btn sm primary" data-act="quick:${t.id}:beat:1" ${hasBase?'':'disabled'}>ต่ำกว่าอันดับ 1 อยู่ 1%</button>
          <span class="dim">คำนวณจากราคาต่ำสุดที่เห็นบนกระดาน</span></div>` : ''}
        <p class="dim" style="margin-top:.4rem">${hasBase
          ? 'กดแล้วราคาทุกรายการถูกลดตามสัดส่วนทันที ตรวจยอดรวมแล้วกด “หยอดราคา” เพื่อยืนยัน (ยังไม่ส่งจนกดยืนยัน)'
          : 'กรอกราคาตั้งต้นให้ครบทุกรายการก่อน แล้วปุ่มลดราคาจะใช้งานได้'}</p>
      </div>` : `
      <div>
        <div class="spread" style="margin-bottom:.4rem"><span class="eyebrow">เอกสารแนบ</span>
          <span class="dim">${d.docs.length}/${t.docs.length} ไฟล์</span></div>
        <div class="stack" style="gap:.5rem">
          ${t.docs.map((req,i)=>{
            const ok = d.docs.length > i;
            return `<span class="req ${ok?'ok':'no'}">${ok?ICON.check:ICON.circle}<span>${esc(req)}</span></span>`;
          }).join('')}
        </div>
        ${d.docs.length?`<div class="docs" style="margin-top:.6rem">${d.docs.map((f,i)=>`
          <div class="doc"><span class="ext">${esc(ext(f.n))}</span><span class="n">${esc(f.n)}</span><span class="dim num">${kb(f.s)}</span>
          ${locked?'':`<button type="button" class="btn ghost sm" data-act="rmdoc:${t.id}:${i}" aria-label="ลบไฟล์">ลบ</button>`}</div>`).join('')}</div>`:''}
        ${locked?'':`<label class="drop" style="margin-top:.6rem">
          <input type="file" multiple data-act="addfiles:${t.id}" style="position:absolute;opacity:0;width:1px;height:1px">
          <b style="font-family:var(--font-d)">เลือกไฟล์เพื่อแนบ</b>
          <span class="dim" style="display:block">PDF, JPG, PNG, XLSX — ไม่เกิน 20 MB ต่อไฟล์</span>
        </label>`}
      </div>`}

      <label class="f"><span>หมายเหตุ / เงื่อนไข (ยืนราคา, ระยะเวลาส่งมอบ, เงื่อนไขชำระเงิน)</span>
        <textarea data-note ${locked?'disabled':''} placeholder="เช่น ยืนราคา 30 วัน ส่งมอบภายใน 14 วันหลังรับ PO">${esc(d.note)}</textarea></label>
    </div>
    ${locked?'':`<footer style="padding:.75rem 1rem;border-top:1px solid var(--line);display:flex;gap:.6rem;align-items:center;flex-wrap:wrap">
      <span class="dim" style="flex:1">ช่วงประมูลไม่ต้องแนบไฟล์ ปรับราคาได้ไม่จำกัดจนหมดเวลา · เอกสารส่งภายใน 3 วันหลังปิดประมูล</span>
      <button class="btn primary" type="submit">${bidding?(existing?'หยอดราคาใหม่':'หยอดราคา'):(existing?'ยืนยันราคาใหม่':'ยื่นใบเสนอราคา')}</button>
    </footer>`}
  </form>`;
}

// งานเปิดราคา: ช่วงประมูลเน้นสู้ราคาอย่างเดียว เอกสารส่งหลังปิดรับราคา
const DOCS_GRACE = 3*DAY;                         // เวลาส่งเอกสารหลังปิดประมูล (ทั้งงานปิดและเปิด)
function laterDocsCard(t){
  if (isBuyer()) return '';
  const existing = bidOf(t.id, state.userId);
  if (!existing) return '';
  const st = statusOf(t);
  const have = existing.docs.length, need = t.docs.length;
  const ok = have >= need;
  const dueAt = t.closesAt + DOCS_GRACE;
  const late = Date.now() > dueAt;
  const checklist = t.docs.map((req,i)=>`<span class="req ${have>i?'ok':'no'}">${have>i?ICON.check:ICON.circle}<span>${esc(req)}</span></span>`).join('');

  // --- ระหว่างประมูล: ยังไม่เปิดให้แนบ ---
  if (st === 'live'){
    return `<div class="card">
      <header><h3>เอกสารประกอบ</h3><span class="chip flat">${ICON.lock}ส่งหลังปิดประมูล</span></header>
      <div class="body stack">
        <div class="rule"><b>ช่วงนี้ยังไม่ต้องส่งเอกสาร</b> — เน้นสู้ราคาให้เต็มที่ก่อน ระบบจะเปิดให้แนบเอกสารเมื่อปิดรับราคา
          (อีก <span class="cd" data-cd="${t.closesAt}">${cdText(t.closesAt-Date.now())}</span>)
          แล้วมีเวลาส่งอีก 3 วัน</div>
        <span class="eyebrow">รายการที่ต้องเตรียมไว้</span>
        ${checklist}
      </div>
    </div>`;
  }

  // --- ปิดประมูลแล้ว: ถึงเวลาส่งเอกสาร ---
  return `<div class="card">
    <header><h3>ส่งเอกสารประกอบ</h3>
      ${ok?`<span class="chip live">${ICON.check}ครบ ${have}/${need}</span>`
          :`<span class="chip ${late?'crit':'warn'}">${have}/${need} ไฟล์</span>`}</header>
    <div class="body stack">
      <div class="rule" ${ok?'':`style="border-left-color:var(--${late?'crit':'warn'});background:var(--${late?'crit':'warn'}-wash)"`}>
        ${ok ? '<b>เอกสารครบแล้ว</b> — รอฝ่ายจัดซื้อพิจารณาผล'
             : late ? `<b>เกินกำหนดส่งเอกสารแล้ว</b> — ครบกำหนด ${stamp(dueAt)} ยังส่งได้แต่ฝ่ายจัดซื้อมีสิทธิ์ตัดสิทธิ์ใบเสนอราคาของท่าน`
                    : `<b>ปิดรับราคาแล้ว กรุณาส่งเอกสารภายใน <span class="cd" data-cd="${dueAt}">${cdText(dueAt-Date.now())}</span></b> — ครบกำหนด ${stamp(dueAt)} ไม่ส่งตามกำหนดถือว่าสละสิทธิ์`}
      </div>
      ${checklist}
      ${existing.docs.length?docList(existing.docs):''}
      ${statusOf(t)==='awarded' ? '<p class="dim">ประกาศผลแล้ว ปิดรับเอกสารเพิ่ม</p>' : `<label class="drop">
        <input type="file" multiple data-act="latefiles:${t.id}" style="position:absolute;opacity:0;width:1px;height:1px">
        <b style="font-family:var(--font-d)">แนบเอกสารประกอบ</b>
        <span class="dim" style="display:block">ใบเสนอราคาลงนาม, หนังสือรับรอง, ภ.พ.20 — ไม่เกิน 20 MB ต่อไฟล์</span>
      </label>`}
    </div>
  </div>`;
}

/* ---------------- leaderboard / visibility ---------------- */
function boardCard(t){
  const all = ranked(t.id);
  const vis = visibleBids(t, state.userId);
  const canSee = canSeeRivalPrices(t, state.userId);
  const best = all.length ? bidTotal(all[0]) : 0;
  const mine = !isBuyer() ? bidOf(t.id, state.userId) : null;
  const myRank = mine ? all.findIndex(b=>b.id===mine.id)+1 : 0;

  let rule;
  if (t.type==='open') rule = `<div class="rule"><b>ประมูลแบบเปิดราคา</b> — ทุกฝ่ายเห็นราคาของกันแบบเรียลไทม์ ปรับราคาได้จนหมดเวลา ${isBuyer()?'':'ชื่อคู่แข่งถูกปิดไว้ แสดงเป็นผู้เสนอราคา A/B/C'}</div>`;
  else if (t.unsealedAt) rule = `<div class="rule"><b>เปิดซองแล้ว</b> เมื่อ ${stamp(t.unsealedAt)} — ราคาทุกรายเปิดเผยต่อผู้เข้าร่วมทั้งหมด</div>`;
  else rule = `<div class="rule"><b>ประมูลแบบปิดราคา</b> — ${isBuyer()?'ฝ่ายจัดซื้อก็เห็นราคาไม่ได้จนกดเปิดซองหลังหมดเวลา ทุกการเปิดซองถูกบันทึกไว้':'คุณเห็นได้เฉพาะราคาของตัวเอง ปรับราคาได้ไม่จำกัดจนหมดเวลา ระบบบอกเพียงว่าราคาของคุณถึงเกณฑ์ผู้ซื้อแล้วหรือยัง'}</div>`;

  const ham = visibleHammer(t);                     // ราคาคาดหวังเป็นข้อมูลภายใน ผู้ขายไม่เห็น
  const rows = vis.map((b,i)=>{
    const idx = all.findIndex(x=>x.id===b.id);
    const amt = bidTotal(b);
    const diff = idx>0 ? amt-best : 0;
    const isMe = b.supplierId===state.userId;
    const isHam = hammerFor(t, b);
    const hamMine = isHam && b.supplierId===state.userId;
    return `<div class="bid ${isMe?'me':''} ${idx===0&&canSee?'win':''} ${isHam?'hammer':''}">
      <span class="rank">${isHam?ICON.gavel:(canSee?idx+1:'—')}</span>
      <span class="who"><b>${esc(maskName(t,b.supplierId))}</b>${isHam?`<span style="display:block;margin:.15rem 0">${hammerChip(hamMine)}</span>`:''}
        <span class="dim">${b.docs.length} เอกสาร · ${b.ver>1?`แก้ไข ${b.ver} ครั้ง · `:''}${when(b.at)}</span></span>
      <span class="amt"><span class="v">${baht(amt)}</span>
        <span class="d ${canSee&&idx===0?'down':canSee?'up':''}">${!canSee?'ราคาที่คุณยื่น':(idx===0?'ราคาต่ำสุด':'+'+baht(diff))}</span></span>
    </div>`;
  }).join('');

  const hidden = all.length - vis.length;
  return `<div class="card">
    <header><h3>${t.type==='open'?'กระดานราคาสด':'ใบเสนอราคา'}</h3>
      <span class="chip flat">${all.length} ราย</span>
      ${t.type==='open'&&statusOf(t)==='live'?`<span class="chip onair"><i class="dot pulse"></i>LIVE</span>`:''}</header>
    <div class="body" style="padding:.75rem 1rem">${rule}</div>
    <div class="bids">${rows || `<div class="bid"><span class="rank">—</span><span class="who muted">ยังไม่มีราคาที่คุณเห็นได้</span><span class="amt"></span></div>`}</div>
    ${hidden>0?`<div class="body" style="padding:.7rem 1rem;border-top:1px solid var(--line)">
      <div class="bid" style="padding:0;border:0"><span class="rank">${ICON.lock}</span>
      <span class="who"><b>อีก ${hidden} ราย ยื่นราคาแล้ว</b><span class="dim">ราคาถูกปิดไว้ตามประเภทการประมูล</span></span>
      <span class="amt"><span class="v locked">฿0,000,000</span></span></div></div>`:''}
    ${isBuyer()&&t.target?`<div class="body" style="padding:.7rem 1rem;border-top:1px solid var(--line)">
      <div class="spread"><span class="muted">ราคาคาดหวัง (ภายใน)</span><b class="num">${baht(t.target)}</b></div>
      ${!canSee?`<p class="dim">เทียบกับราคาที่ยื่นได้หลังเปิดซอง — ก่อนหน้านั้นระบบไม่บอกว่ามีรายใดถึงเป้าหรือไม่</p>`
        : ham?`<p class="dim" style="color:var(--warn)">${esc(U(ham.supplierId).org)} ถือค้อนอยู่ที่ ${baht(bidTotal(ham))} — ต่ำกว่าราคาคาดหวัง ${baht(t.target-bidTotal(ham))} ถ้ามีรายอื่นเสนอต่ำกว่านี้ ค้อนย้ายไปรายนั้นทันที</p>`
        : all.length?`<p class="dim">ยังไม่มีรายใดถึงราคาคาดหวัง ราคาต่ำสุดขณะนี้สูงกว่าเป้า ${baht(best-t.target)}</p>`
        :`<p class="dim">ยังไม่มีผู้ยื่นราคา</p>`}
    </div>`:''}
    ${mine && !canSee && t.target ? (()=>{ const hs = myHammerState(t);
      return `<div class="body" style="padding:.7rem 1rem;border-top:1px solid var(--line)">
      <div class="spread"><span class="muted">สถานะค้อน</span>
        <b style="color:${hs==='mine'?'var(--warn)':'var(--ink-2)'}">${
          hs==='mine' ? ICON.gavel+' ค้อนอยู่ที่คุณ'
          : hs==='other' ? 'ค้อนอยู่ที่รายอื่น'
          : 'ยังไม่มีใครได้ค้อน'}</b></div>
      <p class="dim">${
        hs==='mine' ? 'ราคาของคุณถึงเกณฑ์ผู้ซื้อและต่ำสุดขณะนี้ — ถ้ามีรายอื่นเสนอต่ำกว่า ค้อนจะย้ายไปทันที'
        : hs==='other' ? 'มีรายอื่นเสนอต่ำกว่าคุณและถึงเกณฑ์แล้ว ลดราคาแล้วหยอดใหม่เพื่อชิงค้อนกลับมา (ระบบไม่บอกราคาและชื่อของเขา)'
        : (metTarget(t,mine) ? 'ราคาของคุณถึงเกณฑ์แล้ว' : 'ยังไม่มีรายใดถึงเกณฑ์ที่ผู้ซื้อกำหนด ลดราคาแล้วหยอดใหม่ได้ไม่จำกัด')}</p>
    </div>`;})() : ''}
    ${mine&&canSee?`<div class="body" style="padding:.7rem 1rem;border-top:1px solid var(--line)">
      <div class="spread"><span class="muted">อันดับของคุณ</span><b class="num">${myRank} จาก ${all.length}</b></div>
      ${myRank>1?`<p class="dim">ต่ำกว่าอันดับ 1 อยู่ ${baht(bidTotal(mine)-best)} — ปรับราคาได้จนหมดเวลา</p>`:`<p class="dim" style="color:var(--good)">คุณอยู่อันดับ 1 ขณะนี้</p>`}
      ${(()=>{const hm=visibleHammer(t); if(!hm) return '';
        return hm.supplierId===state.userId
          ? `<p class="dim" style="color:var(--warn)">${ICON.gavel} ราคาของคุณถึงเกณฑ์ที่ผู้ซื้อกำหนดแล้ว จึงถือค้อนอยู่ — หากมีรายอื่นเสนอต่ำกว่า ค้อนย้ายไปรายนั้นทันที</p>`
          : `<p class="dim">ค้อนอยู่ที่ผู้เสนอราคาอันดับ 1 — เสนอต่ำกว่าเพื่อชิงกลับมา</p>`;})()}
    </div>`:''}
  </div>`;
}

function statsHtml(t){
  const all = ranked(t.id), best = all.length?bidTotal(all[0]):0, canSee = canSeeRivalPrices(t, state.userId);
  return `
    <div class="stat"><span class="eyebrow">งบประมาณ</span><span class="v">${baht(t.budget)}</span></div>
    <div class="stat"><span class="eyebrow">ผู้ถูกเชิญ / ยื่นแล้ว</span><span class="v">${all.length}/${t.invited.length}</span>
      <div class="meter"><i style="width:${Math.round(all.length/t.invited.length*100)}%"></i></div></div>
    <div class="stat"><span class="eyebrow">ราคาต่ำสุด</span>
      <span class="v">${canSee ? (all.length?baht(best):'—') : '฿ ——'}</span>
      ${canSee&&all.length?`<div class="meter"><i class="${best<=t.budget?'good':'crit'}" style="width:${Math.min(100,Math.round(best/t.budget*100))}%"></i></div>`:`<span class="dim">${ICON.lock} ปิดไว้จนเปิดซอง</span>`}</div>
    <div class="stat"><span class="eyebrow">ประหยัดจากงบ</span>
      <span class="v" style="color:${canSee&&all.length&&best<=t.budget?'var(--good)':'inherit'}">${canSee&&all.length?((1-best/t.budget)*100).toFixed(1)+'%':'——'}</span>
      ${canSee?'':`<span class="dim">${ICON.lock} ปิดไว้จนเปิดซอง</span>`}</div>
    ${isBuyer()&&t.target?(()=>{ const ham=visibleHammer(t);
      return `<div class="stat"><span class="eyebrow">ราคาคาดหวัง (ภายใน)</span><span class="v">${baht(t.target)}</span>
        ${!canSee?`<span class="dim">${ICON.lock} เทียบได้หลังเปิดซอง</span>`
          : ham?`<span class="dim" style="color:var(--warn)">${ICON.gavel} ถึงเป้าแล้ว · ต่ำกว่า ${baht(t.target-bidTotal(ham))}</span>`
             :`<span class="dim">${all.length?'ยังไม่ถึงเป้า ต่างอีก '+baht(best-t.target):'รอผู้ยื่นราคา'}</span>`}</div>`;})():''}`;
}
function feedCard(t){
  const evs = state.events.filter(e=>e.tenderId===t.id && (isBuyer() || !e.buyerOnly)).slice(0,12);
  return `<div class="card"><header><h3>ความเคลื่อนไหว</h3></header><div class="body">
    ${evs.length?`<div class="feed">${evs.map(e=>`<div class="ev"><time>${clock(e.at)}</time><span>${esc(e.text)}</span></div>`).join('')}</div>`
      :`<p class="dim">ยังไม่มีความเคลื่อนไหวในรอบนี้</p>`}
  </div></div>`;
}
function refreshDetail(t){
  const set = (id,html)=>{ const el=document.getElementById(id); if(el) el.innerHTML=html; };
  set('live-stats', statsHtml(t)); set('live-board', boardCard(t)); set('live-feed', feedCard(t));
  tickCountdowns();
}

/* ---------------- tender detail ---------------- */
function viewDetail(){
  const t = tender(state.tenderId);
  if (!t) return `<div class="page"><p class="muted">ไม่พบประกาศนี้</p></div>`;
  const st = statusOf(t);
  const all = ranked(t.id);
  const best = all.length?bidTotal(all[0]):0;
  const canSee = canSeeRivalPrices(t, state.userId);

  const buyerActions = isBuyer() ? `<div class="card pad stack">
    <span class="eyebrow">การดำเนินการของฝ่ายจัดซื้อ</span>
    ${t.type==='sealed' && !t.unsealedAt ? `
      <button class="btn primary block" data-act="unseal:${t.id}" ${st==='live'?'disabled':''}>${ICON.lock} เปิดซองราคา (${all.length} ราย)</button>
      <p class="dim">${st==='live'?'เปิดซองได้หลังเวลาปิดรับเท่านั้น — ป้องกันการล่วงรู้ราคาก่อนกำหนด':'พร้อมเปิดซอง ระบบจะบันทึกผู้กดและเวลา'}</p>`:''}
    ${st!=='awarded' && canSee && all.length ? `
      <button class="btn primary block" data-act="award:${t.id}:${all[0].supplierId}">${visibleHammer(t)?ICON.gavel+' ':''}อนุมัติผู้ชนะ — ${esc(U(all[0].supplierId).org)}</button>
      ${all[0].docs.length < t.docs.length ? `<div class="rule" style="border-left-color:var(--warn);background:var(--warn-wash)">
        <b>ผู้เสนอราคาต่ำสุดยังแนบเอกสารไม่ครบ</b> (${all[0].docs.length}/${t.docs.length})
        ${t.type==='open'?`— งานเปิดราคาให้ส่งเอกสารหลังปิดประมูล ครบกำหนด ${stamp(t.closesAt+DOCS_GRACE)}`:''}
        ควรเรียกเอกสารให้ครบก่อนอนุมัติ</div>` : ''}
      <p class="dim">ราคาต่ำสุด ${baht(best)} · ประหยัดจากงบ ${baht(t.budget-best)} (${((1-best/t.budget)*100).toFixed(1)}%)${t.target?(visibleHammer(t)?' · ถึงราคาคาดหวังแล้ว':' · ยังไม่ถึงราคาคาดหวัง'):''}</p>`:''}
    ${st==='awarded'?`<div class="rule"><b>ผู้ชนะ: ${esc(U(t.awardedTo).org)}</b><br>ราคา ${baht(bidTotal(bidOf(t.id,t.awardedTo)))} — ออก PO แล้ว</div>`:''}
    ${st==='live'?`<button class="btn block" data-act="endnow:${t.id}">ปิดรับราคาทันที (เดโม)</button>`:''}
  </div>` : '';

  const compare = (isBuyer() && canSee && all.length) ? `<div class="card">
    <header><h3>เปรียบเทียบรายรายการ</h3></header>
    <div class="tablewrap"><table>
      <thead><tr><th>รายการ</th><th class="r">จำนวน</th>${all.map(b=>`<th class="r">${visibleHammer(t)&&visibleHammer(t).id===b.id?ICON.gavel+' ':''}${esc(U(b.supplierId).org.replace(/^(บจก\.|หจก\.)\s*/,''))}</th>`).join('')}</tr></thead>
      <tbody>${t.items.map(it=>{
        const prices = all.map(b=>Number(b.lines[it.id])||0);
        const low = Math.min(...prices.filter(p=>p>0));
        return `<tr><td>${esc(it.name)}</td><td class="r mono dim">${it.qty.toLocaleString('th-TH')} ${esc(it.unit)}</td>
          ${prices.map(p=>`<td class="r mono" ${p===low?'style="color:var(--good);font-weight:600"':''}>${p?p.toLocaleString('th-TH',{minimumFractionDigits:2}):'—'}</td>`).join('')}</tr>`;
      }).join('')}</tbody>
      <tfoot><tr><td colspan="2" class="r">รวม</td>${all.map(b=>`<td class="r mono">${baht(bidTotal(b))}</td>`).join('')}</tr></tfoot>
    </table></div>
    <div class="body" style="padding:.7rem 1rem;border-top:1px solid var(--line)">
      ${all.map(b=>`<div style="margin-bottom:.6rem"><b style="font-size:.86rem">${esc(U(b.supplierId).org)}</b>
        ${b.note?`<p class="dim">${esc(b.note)}</p>`:''}${docList(b.docs)}</div>`).join('')}
    </div>
  </div>` : '';

  return `<div class="page">
    <div>
      <button class="btn ghost sm" data-act="back">${ICON.back} กลับ</button>
    </div>
    <div class="pagehead">
      <div class="grow stack" style="gap:.45rem">
        <div class="row" style="gap:.4rem">${typeChip(t)}${statusChip(t)}<span class="dim num">${t.code}</span></div>
        <h1>${esc(t.title)}</h1>
        <p class="muted">${esc(t.desc)}</p>
      </div>
      <div class="stack" style="gap:.25rem;align-items:flex-end;text-align:right">
        <span class="eyebrow">${st==='live'?'เหลือเวลา':'เวลาปิดรับ'}</span>
        <span style="font-size:1.2rem">${cdHtml(t)}</span>
        <span class="dim">${stamp(t.closesAt)}</span>
      </div>
    </div>

    <div class="grid g4" id="live-stats">${statsHtml(t)}</div>

    <div class="split">

  return `<div class="page">

      <div class="stat"><span class="eyebrow">ใบเสนอราคา 24 ชม.</span><span class="v">${bidsToday}</span><span class="dim">รวมการปรับราคา</span></div>
      <div class="stat"><span class="eyebrow">รอเปิดซอง</span><span class="v" style="color:${toUnseal.length?'var(--warn)':'inherit'}">${toUnseal.length}</span><span class="dim">ต้องดำเนินการ</span></div>
      <div class="stat"><span class="eyebrow">ประหยัดจากงบ (ปิดจบ)</span><span class="v" style="color:var(--good)">${baht(saved)}</span><span class="dim">${done.length} ประกาศ</span></div>
    </div>
    ${toUnseal.length?`<div class="card"><header><h3>รอเปิดซอง</h3><span class="chip warn">${toUnseal.length}</span></header>

        <div class="tlist">${live.map(tenderRow).join('') || `<div style="padding:1rem" class="dim">—</div>`}</div></div>
      <div class="card"><header><h3>ความเคลื่อนไหวล่าสุด</h3></header><div class="body">
        ${state.events.length?`<div class="feed">${state.events.filter(e=>isBuyer()||!e.buyerOnly).slice(0,14).map(e=>`<div class="ev"><time>${clock(e.at)}</time><span>${esc(e.text)}</span></div>`).join('')}</div>`
          :`<p class="dim">ยังไม่มีความเคลื่อนไหว</p>`}</div></div>

/* ---------------- create tender ---------------- */
const newT = {title:'', type:'sealed', budget:'', target:'', closes:'', docs:DOCS.join('\n'), files:[],
  items:[{name:'',spec:'',qty:'',unit:'ชิ้น'}], invited:['sup1','sup2','sup3']};
function defaultClose(){ const d=new Date(Date.now()+3*DAY); d.setSeconds(0,0); return new Date(d.getTime()-d.getTimezoneOffset()*MIN).toISOString().slice(0,16); }
function readCreate(){
  const q = s => document.querySelector(s);
  if (!q('[data-nt="title"]')) return;
  newT.title = q('[data-nt="title"]').value;
  newT.type  = document.querySelector('[name="ntype"]:checked').value;
  newT.budget= q('[data-nt="budget"]').value;
  newT.target= q('[data-nt="target"]').value;
  newT.closes= q('[data-nt="closes"]').value;
  newT.docs  = q('[data-nt="docs"]').value;
  newT.items = [...document.querySelectorAll('[data-item]')].map(row=>({
    name: row.querySelector('[data-i="name"]').value,
    spec: row.querySelector('[data-i="spec"]').value,
    qty:  row.querySelector('[data-i="qty"]').value,
    unit: row.querySelector('[data-i="unit"]').value }));
  newT.invited = [...document.querySelectorAll('[data-inv]:checked')].map(c=>c.dataset.inv);
}

        </label>

      <label class="f"><span>เอกสารที่ซัพพลายเออร์ต้องแนบกลับ (บรรทัดละ 1 รายการ)</span><textarea data-nt="docs">${esc(newT.docs)}</textarea></label>
      <div>
        <span class="eyebrow" style="display:block;margin-bottom:.4rem">เชิญซัพพลายเออร์</span>

      <div class="whoami">
        <div class="row" style="gap:.5rem;flex-wrap:nowrap">
          <span class="avatar">${esc(me().org.replace(/^(บจก\.|หจก\.)\s*/,'').slice(0,2))}</span>
          <span style="min-width:0"><b style="font-size:.82rem;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(me().org)}</b>
          <span class="dim">${esc(me().name)}</span></span>
        </div>
        <button class="btn sm block" data-act="openpw">เปลี่ยนรหัสผ่าน</button>
        <button class="btn sm block" data-act="logout">สลับบัญชี</button>
      </div>
    </aside>
    <main class="main">
      <div class="demobar">${controls}</div>
      <div class="mtop">
        <img class="logo sm" src="${LOGO}" alt="CJx">
        <b style="font-family:var(--font-d);font-size:.9rem;flex:1">${esc(me().org)}</b>
        <button class="btn ghost sm" data-act="logout">สลับบัญชี</button>
      </div>
      ${body}
    </main>
    <nav class="tabbar">${items.map(i=>`<button data-act="nav:${i.v}" ${i.cur?'aria-current="page"':''}>${i.ic}<span>${i.label}</span></button>`).join('')}</nav>
  </div>`;
  document.body.classList.toggle('phonemode', state.phone);
  app.innerHTML = state.phone
    ? `<div class="stage">
         <div class="stagebar">${controls}</div>
         <div class="phone">
           <div class="statusbar"><span class="num" data-phclock>${clock(Date.now())}</span><span>5G · 100%</span></div>
           <span class="island"></span>
           <div class="screen">${shell}${sheet}</div>
         </div>
         <p class="stagenote">พรีวิวขนาด iPhone 390 × 788 pt — เป็นแอปตัวเดียวกันกับที่เห็นบนจอคอม เลื่อนและกดใช้งานในกรอบได้ทุกปุ่ม<br>เปิดลิงก์นี้บนมือถือจริงก็ได้หน้าตาเดียวกัน</p>
       </div>`
    : shell + sheet;
  toastHost();
  if (keep){ const el = document.querySelector(keep);
    if (el){ el.focus(); try{ el.setSelectionRange(el.value.length, el.value.length); }catch(err){} } }
  tickCountdowns();
}

function nextCode(){
  const d = new Date(), pre = `RFQ_${d.getFullYear()}_${String(d.getMonth()+1).padStart(2,'0')}_`;
  const nums = state.tenders.filter(t=>t.code.startsWith(pre)).map(t=>parseInt(t.code.slice(pre.length),10)||0);
  return pre + String((nums.length?Math.max(...nums):0)+1).padStart(3,'0');   // ของจริงให้ DB ออกเลขรัน (sequence) กันเลขชนกัน
}

/* ---------------- events / actions ---------------- */
function ev(tenderId, text, buyerOnly){
  state.events.unshift({at:Date.now(), tenderId, text, buyerOnly:!!buyerOnly});
  if (state.events.length > 80) state.events.length = 80;
}
function go(view){ state.view = view; state.tenderId = null; render(); }

document.addEventListener('click', e=>{
  if (e.target.classList && e.target.classList.contains('scrim')){ readCreate(); state.sheet=null; state.pwSheet=false; render(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const [act, a, b] = el.dataset.act.split(':');

  if (act==='login'){
    state.userId = a;
    state.view = U(a).role==='buyer' ? 'dash' : 'list';
    render(); return;
  }
  if (act==='logout'){ state.userId=null; state.tenderId=null; state.sheet=null; render(); return; }
  if (act==='nav'){ go(a); return; }
  if (act==='open'){ state.tenderId=a; state.view='detail'; render(); window.scrollTo(0,0); return; }
  if (act==='back'){ go('list'); return; }
  if (act==='reset'){ location.reload(); return; }
  if (act==='togglephone'){ state.phone = !state.phone; render(); window.scrollTo(0,0); return; }
  if (act==='openpw'){ state.pwSheet = true; render(); return; }
  if (act==='closepw'){ state.pwSheet = false; render(); return; }
  if (act==='forgotpw'){ toast('ส่งลิงก์ตั้งรหัสผ่านใหม่แล้ว', 'เดโม: ของจริงส่งอีเมลพร้อมลิงก์ที่ใช้ได้ครั้งเดียว', 'good'); return; }
  if (act==='sheet'){ if(a==='create'){ state.sheet='create'; } else { readCreate(); state.sheet=null; } render(); return; }
  if (act==='additem'){ readCreate(); newT.items.push({name:'',spec:'',qty:'',unit:'ชิ้น'}); render(); return; }
  if (act==='rmitem'){ readCreate(); newT.items.splice(+a,1); render(); return; }
  if (act==='rmdoc'){ state.draft[a].docs.splice(+b,1); render(); return; }
  if (act==='rmnewfile'){ readCreate(); newT.files.splice(+a,1); render(); return; }
  if (act==='quick'){                       // a=tenderId, b=mode(cut|beat), extra=pct
    const t = tender(a), mode = b, pct = Number(el.dataset.act.split(':')[3]) || 1;
    const d = state.draft[t.id];
    if (!d || !t.items.every(it=>Number(d.lines[it.id])>0))
      return toast('กรอกราคาให้ครบก่อน', 'ปุ่มลดราคาใช้สัดส่วนจากราคาที่กรอกไว้', 'crit');
    const cur = total(t, d.lines);
    const all = ranked(t.id), best = all.length ? bidTotal(all[0]) : 0;
    const target = mode === 'beat' ? best * (1 - pct/100) : cur * (1 - pct/100);
    if (!(target > 0)) return;
    const f = target / cur;
    // ปัดลงเพื่อให้ยอดรวมไม่เกินเป้าที่กด (เช่น ต่ำกว่าอันดับ 1 จริง 1%)
    t.items.forEach(it=>{ d.lines[it.id] = Math.floor(Number(d.lines[it.id]) * f * 100) / 100; });
    render();
    toast(mode === 'beat' ? `ตั้งราคาต่ำกว่าอันดับ 1 อยู่ ${pct}%` : `ลดราคาลง ${pct}%`,
          `ยอดใหม่ ${baht(total(t, d.lines))} — ตรวจแล้วกดหยอดราคา`);
    return;
  }

  if (act==='unseal'){
    const t = tender(a);
    if (statusOf(t)==='live') return;
    t.unsealedAt = Date.now();
    ev(t.id, `${me().name} เปิดซองราคา ${t.code} — ${bidsOf(t.id).length} ราย`);
    toast('เปิดซองแล้ว', `${t.code} · ${bidsOf(t.id).length} ใบเสนอราคา`, 'good');
    render(); return;
  }
  if (act==='endnow'){
    const t = tender(a); t.closesAt = Date.now()-1000;
    ev(t.id, `ฝ่ายจัดซื้อปิดรับราคา ${t.code} ก่อนกำหนด`);
    toast('ปิดรับราคาแล้ว', t.code); render(); return;
  }
  if (act==='award'){
    const t = tender(a);
    t.awardedTo = b; if (t.closesAt > Date.now()) t.closesAt = Date.now()-1000;
    if (t.type==='sealed' && !t.unsealedAt) t.unsealedAt = Date.now();
    ev(t.id, `ประกาศผู้ชนะ ${t.code}: ${U(b).org} ที่ ${baht(bidTotal(bidOf(t.id,b)))}`);
    toast('อนุมัติผู้ชนะแล้ว', `${U(b).org} · ${baht(bidTotal(bidOf(t.id,b)))}`, 'good');
    render(); return;
  }
});

document.addEventListener('input', e=>{
  if (e.target.dataset.pw === 'new'){
    const v = e.target.value;
    const ok = [v.length>=8, /[a-zA-Z]/.test(v), /\d/.test(v)];
    document.querySelectorAll('[data-pwrules] .req').forEach((el,i)=>{
      const label = el.querySelector('span');
      el.className = 'req ' + (ok[i]?'ok':'no');
      el.innerHTML = (ok[i]?ICON.check:ICON.circle) + label.outerHTML;
    });
    return;
  }
  const t = state.tenderId && tender(state.tenderId);
  if (!t) return;
  const d = state.draft[t.id];
  if (!d) return;
  if (e.target.dataset.line){
    const id = e.target.dataset.line;
    d.lines[id] = e.target.value === '' ? undefined : Number(e.target.value);
    const item = t.items.find(i=>i.id===id);
    const cell = document.querySelector(`[data-linetotal="${id}"]`);
    if (cell) cell.textContent = d.lines[id] ? baht2(d.lines[id]*item.qty) : '—';
    const sum = total(t, d.lines);
    const sc = document.querySelector('[data-sum]'); if (sc) sc.textContent = sum ? baht2(sum) : '—';
    const vb = document.querySelector('[data-vsbudget]');
    if (vb){ const p = (sum-t.budget)/t.budget*100; vb.textContent = sum ? (p>0?'+':'')+p.toFixed(1)+'%' : '—';
      vb.style.color = sum ? (p<=0?'var(--good)':'var(--crit)') : ''; }
  }
  if (e.target.hasAttribute('data-note')) d.note = e.target.value;
});

document.addEventListener('change', e=>{
  const act = e.target.dataset.act || '';
  if (act === 'togglesim'){ state.sim = e.target.checked; return; }
  if (act.startsWith('latefiles:')){
    const tid = act.split(':')[1];
    const b = bidOf(tid, state.userId);
    if (!b) return;
    [...e.target.files].forEach(f=>{
      if (f.size > 20*1048576){ toast('ไฟล์ใหญ่เกินกำหนด', `${f.name} เกิน 20 MB`, 'crit'); return; }
      b.docs.push({n:f.name, s:f.size});
    });
    const t = tender(tid);
    ev(tid, `${me().org} แนบเอกสารประกอบ ${b.docs.length}/${t.docs.length} รายการ`);
    e.target.value = '';
    toast(b.docs.length >= t.docs.length ? 'เอกสารครบแล้ว' : 'แนบเอกสารแล้ว',
          `${b.docs.length}/${t.docs.length} รายการ`, b.docs.length >= t.docs.length ? 'good' : '');
    render(); return;
  }
  if (act.startsWith('addfiles:')){
    const tid = act.split(':')[1];
    if (tid === 'new'){                     // ไฟล์ที่ผู้ซื้อแนบไปกับประกาศ
      readCreate();
      [...e.target.files].forEach(f=>{
        if (f.size > 20*1048576){ toast('ไฟล์ใหญ่เกินกำหนด', `${f.name} เกิน 20 MB`, 'crit'); return; }
        newT.files.push({n:f.name, s:f.size});
      });
      e.target.value = ''; render(); return;
    }
    const d = state.draft[tid] || (state.draft[tid] = {lines:{},docs:[],note:''});
    [...e.target.files].forEach(f=>{
      if (f.size > 20*1048576){ toast('ไฟล์ใหญ่เกินกำหนด', `${f.name} เกิน 20 MB`, 'crit'); return; }
      d.docs.push({n:f.name, s:f.size});
    });
    e.target.value = '';
    render();
  }
});

document.addEventListener('submit', e=>{
  e.preventDefault();
  const f = e.target.closest('[data-act]');
  if (!f) return;
  const [act, a] = f.dataset.act.split(':');

  if (act==='savepw'){
    const val = k => (f.querySelector(`[data-pw="${k}"]`)||{}).value || '';
    const cur = val('cur'), nw = val('new'), cf = val('confirm');
    if (cur !== DEMO_TEMP_PW) return toast('รหัสผ่านเดิมไม่ถูกต้อง', `เดโมใช้ ${DEMO_TEMP_PW}`, 'crit');
    if (nw.length < 8 || !/[a-zA-Z]/.test(nw) || !/\d/.test(nw))
      return toast('รหัสผ่านใหม่ยังไม่ผ่านเกณฑ์', 'ยาว 8 ตัวขึ้นไป มีตัวอักษรและตัวเลข', 'crit');
    if (nw === cur) return toast('รหัสใหม่ซ้ำกับรหัสเดิม', 'ตั้งรหัสที่ต่างจากที่ได้รับมา', 'crit');
    if (nw !== cf) return toast('รหัสผ่านไม่ตรงกัน', 'กรอกรหัสใหม่ให้ตรงกันทั้งสองช่อง', 'crit');
    state.pwChanged[state.userId] = true;
    state.pwSheet = false;
    toast('เปลี่ยนรหัสผ่านแล้ว', 'ครั้งต่อไปให้เข้าสู่ระบบด้วยรหัสใหม่', 'good');
    render(); return;
  }

  if (act==='submitbid'){
    const t = tender(a), d = state.draft[t.id];
    const missing = t.items.filter(it=>!(Number(d.lines[it.id])>0));
    if (missing.length){ toast('ยังกรอกราคาไม่ครบ', `เหลือ ${missing.length} รายการที่ยังไม่มีราคา`, 'crit'); return; }
    // ไม่บังคับเอกสารตอนหยอดราคา — ส่งเอกสารภายใน 3 วันหลังปิดประมูล (การ์ด "ส่งเอกสารประกอบ")
    const sum = total(t, d.lines);
    const prev = bidOf(t.id, state.userId);
    if (prev){
      prev.lines = {...d.lines}; prev.note = d.note; prev.at = Date.now(); prev.ver++;
      if (d.docs.length) prev.docs = d.docs.slice();   // ปรับราคาโดยไม่แนบใหม่ = เก็บไฟล์เดิมไว้
    } else {
      state.bids.push({id:uid('b'), tenderId:t.id, supplierId:state.userId,
        lines:{...d.lines}, docs:d.docs.slice(), note:d.note, at:Date.now(), ver:1});
    }
    ev(t.id, `${me().org} ${prev?'ปรับราคาเป็น':'ยื่นราคา'} ${baht(sum)} (${t.code})`);
    const hs = myHammerState(t);
    if (t.type==='sealed')
      toast(prev?'หยอดราคาใหม่แล้ว':'หยอดราคาแล้ว',
            hs==='mine' ? 'ค้อนอยู่ที่คุณแล้ว — ราคายังปิดผนึกไว้'
            : hs==='other' ? 'ยังไม่ได้ค้อน มีรายอื่นเสนอต่ำกว่าและถึงเกณฑ์'
            : 'ยังไม่ถึงเกณฑ์ที่ผู้ซื้อกำหนด — ลดราคาแล้วหยอดใหม่ได้', hs==='mine'?'good':'');
    else {
      const r = ranked(t.id).findIndex(x=>x.supplierId===state.userId)+1;
      toast(prev?'หยอดราคาใหม่แล้ว':'หยอดราคาแล้ว', `${baht(sum)} · อันดับ ${r} จาก ${bidsOf(t.id).length}`, 'good');
    }
    render(); return;
  }

  if (act==='createtender'){
    readCreate();
    const closes = new Date(newT.closes).getTime();
    if (!newT.invited.length){ toast('ยังไม่ได้เชิญใคร', 'เลือกซัพพลายเออร์อย่างน้อย 1 ราย', 'crit'); return; }
    if (!(closes > Date.now())){ toast('เวลาปิดรับไม่ถูกต้อง', 'ต้องเป็นเวลาในอนาคต', 'crit'); return; }
    const t = {
      id: uid('t'), code: nextCode(),
      title: newT.title.trim(), type: newT.type, budget: Number(newT.budget), closesAt: closes,
      target: Number(newT.target)||0,
      awardedTo:null, unsealedAt:null, buyer: state.userId, invited: newT.invited.slice(),
      docs: newT.docs.split('\n').map(s=>s.trim()).filter(Boolean), attachments: newT.files.slice(),
      desc: newT.type==='sealed' ? 'ประมูลแบบปิดซอง — ปรับราคาได้จนหมดเวลา ไม่มีใครเห็นราคาของกัน เปิดซองพร้อมกันทีเดียว'
                                 : 'ประมูลแบบเปิด — เห็นราคาคู่แข่งเรียลไทม์ ปรับราคาได้จนหมดเวลา',
      items: newT.items.map((it,i)=>({id:'i'+(i+1), name:it.name.trim(), spec:it.spec.trim()||'—', qty:Number(it.qty), unit:it.unit.trim()||'ชิ้น'})),
    };
    state.tenders.unshift(t);
    newT.files = []; newT.title = '';
    ev(t.id, `ประกาศเชิญประมูลใหม่ ${t.code} — เชิญ ${t.invited.length} ราย`);
    toast('ประกาศแล้ว', `${t.code} · แจ้งเตือนซัพพลายเออร์ ${t.invited.length} ราย`, 'good');
    state.sheet = null; state.tenderId = t.id; state.view = 'detail'; render(); return;
  }
});

/* ---------------- realtime simulation + clock ---------------- */
function simTick(){
  if (!state.sim || !state.userId || state.sheet) return;
  state.tenders.filter(t=>statusOf(t)==='live').forEach(t=>{
    if (Math.random() > 0.5) return;
    const rivals = t.invited.filter(s=>s!==state.userId && U(s).role==='supplier');
    if (!rivals.length) return;
    const sid = rivals[Math.floor(Math.random()*rivals.length)];
    const all = ranked(t.id); if (!all.length) return;
    const ref = all[0], cut = 0.985 + Math.random()*0.012;
    const lines = {};
    t.items.forEach(it=>{ lines[it.id] = Math.round((Number(ref.lines[it.id])||0)*cut*100)/100; });
    const sum = total(t, lines);
    if (!sum) return;
    const hamBefore = hammerBid(t);
    const prev = bidOf(t.id, sid);
    if (prev){ prev.lines = lines; prev.at = Date.now(); prev.ver++; }
    else state.bids.push({id:uid('b'), tenderId:t.id, supplierId:sid, lines,
      docs:[{n:'quotation.pdf',s:296000},{n:'company-cert.pdf',s:1040000},{n:'por-por-20.pdf',s:511000}], note:'', at:Date.now(), ver:1});
    if (t.type==='open') ev(t.id, `${U(sid).org} เสนอราคา ${baht(sum)} (${t.code})`);
    else ev(t.id, `${U(sid).org} ปรับราคาใหม่ (ราคาปิดผนึก · ${t.code})`, true);
    const hamAfter = hammerBid(t);
    if (hamAfter && (!hamBefore || hamBefore.id !== hamAfter.id))
      ev(t.id, t.type==='open'
        ? `ค้อนย้ายไปที่ ${U(hamAfter.supplierId).org} ที่ ${baht(bidTotal(hamAfter))} (ถึงราคาคาดหวัง ${baht(t.target)})`
        : `ค้อนย้ายไปที่ ${U(hamAfter.supplierId).org} (งานปิดราคา · ราคาเปิดเผยหลังเปิดซอง)`, true);
    const lostHammer = hamAfter && hamBefore && hamBefore.supplierId===state.userId
                        && hamAfter.supplierId!==state.userId;
    if (state.userId && !isBuyer() && t.invited.includes(state.userId)){
      const mine = bidOf(t.id, state.userId);
      const lost = mine && bidTotal(mine) > sum;
      if (t.type==='open')
        toast('มีการเสนอราคาใหม่', `${maskName(t,sid)} — ${baht(sum)}${lostHammer?' · ค้อนย้ายไปรายนั้นแล้ว':(lost?' · คุณเสียอันดับ 1':'')}`, lost?'crit':'');
      else if (lostHammer)
        toast('ค้อนหลุดมือ', 'มีรายอื่นเสนอต่ำกว่าคุณและถึงเกณฑ์ — ลดราคาเพื่อชิงกลับมา', 'crit');
    } else if (isBuyer() && t.type==='open') toast('ใบเสนอราคาใหม่', `${U(sid).org} — ${baht(sum)} (${t.code})`);
    if (state.view==='detail' && state.tenderId===t.id) refreshDetail(t);
    else render();
  });
}
let lastStatuses = '';
function tickCountdowns(){
  document.querySelectorAll('[data-cd]').forEach(el=>{
    const ms = +el.dataset.cd - Date.now();
    el.textContent = cdText(ms);
    el.classList.toggle('soon', ms>0 && ms<60*MIN);
    el.classList.toggle('over', ms<=0);
  });
  const pc = document.querySelector('[data-phclock]');
  if (pc) pc.textContent = clock(Date.now());
  const sig = state.tenders.map(t=>t.id+statusOf(t)).join('|');
  // ต้องบันทึก sig ก่อนเรียก render() เพราะ render() เรียก tickCountdowns() ต่อ
  // ถ้าบันทึกทีหลังจะวนซ้ำไม่จบตอนงานเปลี่ยนสถานะ (เวลาปิดประมูลมาถึง)
  const changed = lastStatuses && sig !== lastStatuses;
  lastStatuses = sig;
  if (changed && state.userId && !state.sheet) render();
}
setInterval(tickCountdowns, 1000);
setInterval(simTick, 6000);

/* ---------------- boot ---------------- */
ev('t1', 'บจก. เอเชีย แพ็คเกจจิ้ง ปรับราคาเป็น ' + baht(bidTotal(state.bids[0])) + ' (RFQ_2026_08_014)');
ev('t1', 'หจก. ทรัพย์รุ่งเรือง เทรดดิ้ง ยื่นราคา ' + baht(bidTotal(state.bids[1])) + ' (RFQ_2026_08_014)');
ev('t3', 'ปิดรับราคา RFQ_2026_08_002 — รอฝ่ายจัดซื้อเปิดซอง');
ev('t2', 'ประกาศเชิญประมูล RFQ_2026_08_021 — ปิดรับอีก 2 วัน');
render();
</script>
